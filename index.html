  var ver=(q.get('v')||'').toLowerCase(),inOrder=ver==='yeu',seq=0;
  var wishes=SETS[inOrder?'yeu':'ban'];

  var intro=document.getElementById('intro'),card=document.getElementById('card'),cap2=document.getElementById('cap2'),wishEl=document.getElementById('wish');

  var W,H,S,D,tStart=null,petals=[],lastSpawn=0,lastWish=-1,hideT=null,fc={x:0,y:0},capShown=false;

  function size(){
    D=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;
    cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0);

  size();window.addEventListener('resize',size);

  var clamp=function(x){return Math.max(0,Math.min(1,x))};

        ctx.rotate(Math.sin(t*.5)*.05+(1-ease(b))*.8);
        ctx.shadowColor='rgba(255,90,160,.55)';ctx.shadowBlur=22*S;
        for(var li=0;li<layers.length;li++){
          var L=layers[li],lb=ease(clamp(b*1.5-li*.18));
          if(lb<=0)continue;
          var len=L.len*S*lb,w=L.w*S*lb;
          var gr=ctx.createLinearGradient(0,0,0,-len);gr.addColorStop(0,L.c0);gr.addColorStop(1,L.c1);
          ctx.fillStyle=gr;ctx.globalAlpha=.92;
          for(var k=0;k<L.n;k++){ctx.save();ctx.rotate(L.off+k*6.2832/L.n+li*.1);petalShape(len,w);ctx.restore()}
        }
        ctx.globalAlpha=1;ctx.shadowBlur=0;
        var cb=ease(clamp(b*1.4-.2));
        ctx.fillStyle='#ffd35e';
        for(var d=0;d<14;d++){var ang=d*2.4,r=(5+d*1.6)*S*cb;ctx.beginPath();ctx.arc(Math.cos(ang)*r,Math.sin(ang)*r,2.4*S*cb,0,6.283);ctx.fill()}
        ctx.restore();
      }

      if(b>=.85){
        if(!capShown){capShown=true;cap2.classList.add('show')}
        if(petals.length<8&&now-lastSpawn>950){lastSpawn=now;spawn()}
      }
    }

    for(var j=petals.length-1;j>=0;j--){
      var p=petals[j];if(p.gone)continue;
      p.t+=dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
      p.x=p.x0+Math.sin(p.t*p.f+p.ph)*p.amp;
      p.el.style.transform='translate('+p.x+'px,'+p.y+'px) rotate('+p.rot+'deg)';
      if(p.y>H+30)remove(p);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var sp=$('sp'),sel=$('sel'),toast=$('mtoast');
  var DIR='music/',EXT=/\.(mp3|m4a|wav|ogg|aac|flac|opus)$/i;
  var TRACKS=[{name:'Nhạc hộp (có sẵn)'}];

  var AC=window.AudioContext||window.webkitAudioContext;
  var ctx=null,master=null,on=true,audio=new Audio(),synthT=null,nextT=0,ni=0;
  var ls={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
  function say(t){toast.textContent=t;toast.classList.add('show');clearTimeout(say.t);say.t=setTimeout(function(){toast.classList.remove('show')},3200)}

  function ac(){
    if(!ctx&&AC){
      ctx=new AC();master=ctx.createGain();master.gain.value=.5;
      var dl=ctx.createDelay(1),fb=ctx.createGain();dl.delayTime.value=.28;fb.gain.value=.3;
      master.connect(ctx.destination);master.connect(dl);dl.connect(fb);fb.connect(dl);fb.connect(ctx.destination);
    }
    if(ctx&&ctx.state==='suspended')ctx.resume();
    return ctx;
  }

  var F=[523.25,587.33,659.25,783.99,880,1046.5],M=[0,2,3,2,4,3,2,1,0,2,3,5,4,3,2,0],B=[130.81,196,164.81,196];
  function note(f,t,g,d){
    var o=ctx.createOscillator(),o2=ctx.createOscillator(),e=ctx.createGain(),e2=ctx.createGain();
    o.frequency.value=f;o2.frequency.value=f*2.01;e2.gain.value=.25;
    o2.connect(e2);e2.connect(e);o.connect(e);e.connect(master);
    e.gain.setValueAtTime(.0001,t);e.gain.exponentialRampToValueAtTime(g,t+.012);e.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.start(t);o2.start(t);o.stop(t+d+.05);o2.stop(t+d+.05);
  }
  function sched(){
    while(nextT<ctx.currentTime+.7){
      note(F[M[ni%16]],nextT,.16,1.5);
      if(ni%4===0)note(B[(ni/4|0)%4],nextT,.2,2.2);
      ni++;nextT+=.48;
    }
  }
  function synthStart(){
    if(!ac()){say('Trình duyệt không hỗ trợ âm thanh.');return}
    nextT=ctx.currentTime+.1;ni=0;sched();synthT=setInterval(sched,150);
  }

  function stop(){audio.pause();clearInterval(synthT);synthT=null}
  function play(){
    stop();var t=TRACKS[+sel.value]||TRACKS[0];
    audio.loop=TRACKS.length<2;
    if(!t.src){synthStart();return}
    audio.src=t.src;var p=audio.play();
    if(p&&p.catch)p.catch(function(){});
  }
  function setOn(v){
    on=v;sp.classList.toggle('off',!v);sp.setAttribute('aria-pressed',String(v));
    sp.setAttribute('aria-label',v?'Tắt nhạc':'Bật nhạc');
    if(v)play();else stop();
  }
  audio.addEventListener('error',function(){if(on&&audio.src)say('Không phát được bài này.')});
  audio.addEventListener('ended',function(){if(on&&TRACKS.length>1){sel.value=(+sel.value+1)%TRACKS.length;play()}});

  function kick(){
    if(!on)return;
    if(ctx&&ctx.state==='suspended')ctx.resume();
    if(audio.src&&audio.paused){var p=audio.play();if(p&&p.catch)p.catch(function(){})}
  }
  ['pointerdown','pointerup','touchend','click','keydown'].forEach(function(e){document.addEventListener(e,kick,{passive:true})});
  window.__musicStart=kick;

  function names(){
    return fetch(DIR+'list.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():Promise.reject()})
    .then(function(a){return (Array.isArray(a)?a:(a.files||[])).map(function(f){return String(f).split('/').pop()})})
    .catch(function(){
      return fetch(DIR,{cache:'no-store'}).then(function(r){return r.ok?r.text():Promise.reject()}).then(function(h){
        var d=new DOMParser().parseFromString(h,'text/html');
        return [].map.call(d.querySelectorAll('a[href]'),function(a){
          var x=a.getAttribute('href').split('?')[0].split('/').filter(Boolean).pop()||'';
          try{return decodeURIComponent(x)}catch(e){return x}
        });
      });
    }).then(function(a){
      var seen={};
      return a.filter(function(f){return EXT.test(f)&&!seen[f]&&(seen[f]=1)}).sort(function(x,y){return x.localeCompare(y,'vi',{numeric:true})});
    }).catch(function(){return []});
  }
  function render(){
    sel.innerHTML='';
    TRACKS.forEach(function(t,i){var o=document.createElement('option');o.value=i;o.textContent=t.name;sel.appendChild(o)});
    sel.value=0;
  }
  sp.addEventListener('click',function(){setOn(!on)});
  sel.addEventListener('change',function(){setOn(true)});

  render();play();
  names().then(function(fs){
    if(!fs.length)return;
    TRACKS=fs.map(function(f){return {name:f.replace(EXT,'').replace(/_+/g,' ').replace(/^\d+\s*[-.)]\s*/,'').trim(),src:DIR+encodeURIComponent(f)}});
    render();if(on)play();
  });
})();
</script>
</body>
